function shell(body){return `<aside class="sidebar"><div class="brand">${I('home',34)}handy<span style="color:#9daf89">.</span></div><div class="workspace"><div class="eyebrow">Your workspace</div><label class="sr" for="role">Workspace role</label><select id="role" onchange="changeRole(this.value)"><option value="homeowner" ${state.role==='homeowner'?'selected':''}>Homeowner</option><option value="manager" ${state.role==='manager'?'selected':''}>Property manager</option></select></div><nav class="nav" aria-label="Main navigation">${navButton('overview','grid','Overview')}${navButton('requests','tool','Repairs',visible().filter(r=>r.status!=='complete').length)}${navButton('properties','building',state.role==='manager'?'Properties':'My home')}${navButton('calendar','calendar','Appointments')}</nav><div class="sidebottom"><div class="sidecard">${I('spark',23)}<h4 style="margin-top:12px">Home, handled.</h4><p>A little help with the things<br>that need fixing.</p><button class="btn ghost small" onclick="openGuide()">Explore the prototype ${I('arrow',15)}</button></div><div class="user"><div class="avatar">JC</div><div><strong style="font-size:12px">Jamie Chen</strong><div class="hint">${state.role==='manager'?'Property manager':'Homeowner'}</div></div></div></div></aside><div class="main"><header class="topbar"><div class="crumb">Workspace <span style="padding:0 11px;color:#bac2b4">/</span> <span style="color:var(--ink)">${({overview:'Overview',requests:'Repairs',detail:'Repair details',properties:state.role==='manager'?'Properties':'My home',calendar:'Appointments'})[state.page]}</span></div><div class="topright"><button class="demo" onclick="openGuide()"><span class="dot"></span>Interactive demo · simulated services</button><div class="avatar" style="width:30px;height:30px;font-size:10px">JC</div></div></header><main class="content">${body}<div class="footerhint">${I('home',13)} A little less on your to-do list.</div></main></div>`}

function requestRow(r){return `<button class="requestrow" onclick="openRequest('${r.id}')"><span class="requesticon">${I(categoryIcon[r.category],23)}</span><span class="requestinfo"><h3>${esc(r.title)}</h3><p>${esc(prop(r).name)} ${state.role==='manager'?'· '+esc(prop(r).unit):''} <span style="padding:0 6px">·</span> ${esc(r.room)}</p></span><span class="badge ${statusColor[r.status]}">${r.status==='scheduled'?I('check',11):''}${statusText[r.status]}</span>${I('chevron',17)}</button>`}
function dashboard(all=false){const rs=visible(),active=rs.filter(r=>r.status!=='complete').length,awaiting=rs.filter(r=>['quotes','scheduling','assessment'].includes(r.status)).length,scheduled=rs.filter(r=>r.status==='scheduled').length;const filtered=rs.filter(r=>state.filter==='all'||(state.filter==='action'?['quotes','assessment','scheduling'].includes(r.status):r.status==='scheduled'));return `<div class="row between intro"><div><div class="eyebrow" style="margin-bottom:10px">${all?'Everything in one place':'Your home, in good hands'}</div><h1>${all?'Your repairs':'A little less to manage.'}</h1><p>${all?'From the first photo to the final fix.':`Here’s what’s happening ${state.role==='manager'?'across your properties':'around your home'}.`}</p></div><button class="btn" onclick="newRequest()">${I('plus',17)}Report an issue</button></div>${!all?`<div class="stats"><div class="stat"><div class="row"><span class="muted">Active repairs</span><span class="iconbox">${I('tool',17)}</span></div><div class="value">${String(active).padStart(2,'0')}</div><small>We’re on it</small></div><div class="stat"><div class="row"><span class="muted">Needs your attention</span><span class="iconbox">${I('file',17)}</span></div><div class="value">${String(awaiting).padStart(2,'0')}</div><small>Ready for your next step</small></div><div class="stat"><div class="row"><span class="muted">Appointments booked</span><span class="iconbox">${I('calendar',17)}</span></div><div class="value">${String(scheduled).padStart(2,'0')}</div><small>On the calendar</small></div></div><div class="heroband"><div><div class="eyebrow" style="color:#768967">A helping hand, from start to finish</div><h2>Small issue. One less big task.</h2><p>Show us what needs fixing. We’ll help figure it out, collect quotes, and find a time that works for you.</p><button class="btn secondary" onclick="openRequest('r1')">Explore a sample repair ${I('arrow',15)}</button></div>${houseArt()}</div>`:''}<div class="sectionhead"><h3>${all?'All requests':'Your repair requests'}</h3><div class="row wrap"><div class="filters">${[['all','All'],['action','Needs attention'],['scheduled','Scheduled']].map(([k,l])=>`<button class="filter ${state.filter===k?'selected':''}" onclick="state.filter='${k}';render()">${l}</button>`).join('')}</div>${state.role==='manager'?`<select aria-label="Filter by property" style="padding:8px;border:1px solid var(--line);border-radius:6px;background:white;font-size:12px" onchange="state.propertyFilter=this.value;render()"><option value="all">All properties</option>${properties.map(p=>`<option value="${p.id}" ${state.propertyFilter===p.id?'selected':''}>${p.name}</option>`).join('')}</select>`:''}</div></div><div class="requestlist">${filtered.length?filtered.map(requestRow).join(''):'<div class="empty">No repairs in this view. You’re all caught up.</div>'}</div>${!all?`<div class="bottomgrid"><div class="card"><div class="sectionhead"><h4>${state.role==='manager'?'Your properties':'A place to call home'}</h4><button class="btn ghost small" onclick="go('properties')">View ${I('arrow',14)}</button></div><div class="propertysmall"><div class="housemini">${I('home',30)}</div><div><strong style="font-size:13px">${state.role==='manager'?'3 properties, one workspace':'Maple House'}</strong><p class="muted" style="margin:5px 0;font-size:12px">${state.role==='manager'?'Keep every repair connected to the right address.':'124 Maple Avenue · Main home'}</p></div></div></div><div class="card" style="background:#f1f3eb"><div class="row">${I('shield',21)}<h4>You’re always in control</h4></div><p class="muted">Review the options and approve your provider before we arrange a visit.</p></div></div>`:''}`}

function diagnosisDetails(r){const d=r.diagnosis;if(!d)return'';const ev=d.visibleEvidence||[],qs=d.openQuestions||[],[lo,hi]=d.costRangeUsd||[];return `<div class="subtle" style="margin-top:13px">${I('tool',13)} ${esc(tradeLabel(d.trade))} · ${Math.round((d.confidence||0)*100)}% confidence${lo!=null?` · typical pro cost $${esc(lo)}–$${esc(hi)} (estimate)`:''}</div>${ev.length?`<p class="hint" style="margin-top:12px"><strong>What we see in your photo</strong></p>${hintList(ev)}`:d.photoAnalyzed===false?`<p class="hint" style="margin-top:12px">Based on your description only.</p>`:''}${d.safetyGuidance&&d.urgency!=='emergency'?`<div class="notice">${I('shield',13)} ${esc(d.safetyGuidance)}</div>`:''}${qs.length?`<p class="hint" style="margin-top:12px"><strong>To confirm the issue or part</strong></p>${hintList(qs)}`:''}`}
function emergencyCard(r){const d=r.diagnosis;return `<div class="card" style="border-color:#e3b4a8;background:#fdf1ee"><h3 style="color:#a2452f">Get safe first.</h3><p style="margin-top:8px">${esc(d.safetyGuidance||r.notice||'If anyone is in danger, leave and call 911.')}</p><p class="hint" style="margin-top:14px">This needs emergency services, not a quote. Handy does not dispatch emergency repairs.</p></div>`}
function diyCard(r){const d=r.diagnosis,p=d&&d.fixPath==='diy'&&d.diyPlan;if(!p)return'';const total=p.parts.reduce((s,x)=>s+(x.approxPriceUsd||0),0);return `<div class="card"><div class="hint" style="text-transform:uppercase;letter-spacing:1.7px;font-weight:700;font-size:10px">${I('tool',14)} Simple DIY fix</div><h3 style="margin-top:10px">You may be able to fix this yourself.</h3><p class="muted">${p.minutes?`About ${esc(p.minutes)} min`:'A short job'}${total?` · parts about $${esc(total)}`:''} · no service visit needed.</p><p class="hint" style="margin-top:14px"><strong>Parts to buy</strong> (match not confirmed until you check)</p><ul class="hint" style="padding-left:18px;margin:4px 0 10px">${p.parts.map(x=>`<li>${esc(x.name)}${x.approxPriceUsd!=null?` · ~$${esc(x.approxPriceUsd)}`:''}<br>${esc(x.compatibility)}</li>`).join('')}</ul>${p.tools.length?`<p class="hint"><strong>Tools:</strong> ${p.tools.map(t=>esc(t)).join(', ')}</p>`:''}<p class="hint" style="margin-top:10px"><strong>General steps</strong> (your part's own instructions come first)</p>${hintList(p.steps,'ol')}<div class="notice">${I('shield',13)} ${esc(p.stopIf)}</div></div>`}
function partOptionRow(o){return `<div class="quote" style="margin-bottom:10px"><div class="bestlabel">${esc((o.label||'').toUpperCase())}</div><h4>${esc(o.product)}</h4><div class="rating">${o.rating!=null?`★ ${esc(o.rating)}${o.reviewCount!=null?` (${esc(o.reviewCount)})`:''}`:''}</div><div class="price">${o.priceUsd!=null?`$${esc(o.priceUsd)}`:'Check price at seller'}</div><div class="quotelines">${esc(o.seller)}${o.delivery?` · ${esc(o.delivery)}`:''}${o.returnPolicy?` · ${esc(o.returnPolicy)}`:''}</div><p class="hint">${esc(o.fitNote)}</p><a class="btn secondary wide" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">View at ${esc(o.seller)} ${I('arrow',13)}</a></div>`}
function partSearchResults(r){const ps=r.partSearch;if(!ps)return'';if(ps.status==='searching')return `<div class="subtle" style="margin-top:14px">${I('clock',13)} Searching real US retailers for “${esc(ps.partName)}”…</div>`;if(ps.status==='failed')return `<div class="notice" style="margin-top:14px">${I('shield',13)} ${esc(ps.error||'No verified options found.')}</div>`;return `<div style="margin-top:16px"><p class="hint" style="margin-bottom:8px">${ps.source==='mock'?'Sample results · demo data':'Live search results'} for “${esc(ps.partName)}”</p>${ps.options.map(partOptionRow).join('')}</div>`}
function proPartsCard(r){const searching=r.partSearch&&r.partSearch.status==='searching';return `<div class="card"><div class="hint" style="text-transform:uppercase;letter-spacing:1.7px;font-weight:700;font-size:10px">${I('tool',14)} Want to try it yourself?</div><h3 style="margin-top:10px">This looks like it needs a professional — but you can still look for the part.</h3><p class="muted">We can search real US retailers for a compatible part. We never order or pay for anything — a professional should still confirm the fix is right before you buy.</p><button class="btn secondary" id="searchPartsBtn" onclick="searchPartsAnyway()" ${searching?'disabled':''}>${I('spark',16)}${r.partSearch?'Search again':'Search for parts'}</button>${partSearchResults(r)}</div>`}
const assessment=r=>r.diagnosis?{title:esc(r.diagnosis.title),text:esc(r.diagnosis.summary||r.diagnosis.likelyCause),scope:esc(r.diagnosis.proposedScope||r.diagnosis.jobBrief)}:r.category==='plumbing'?{title:'Possible loose drain connection',text:'The description is consistent with a loose seal or connection around the sink drain. A plumber should check the trap and nearby fittings to confirm the source.',scope:'Inspect the sink drain, reseal or replace a standard fitting, and check for leaks.'}:r.category==='hvac'?{title:'Cooling system inspection needed',text:'Weak cooling can have several causes, including restricted airflow or a system fault. An HVAC professional will need to inspect the unit to confirm.',scope:'Inspect airflow, filter, thermostat, and system operation. Additional work quoted after diagnosis.'}:{title:r.demo?'Possible door alignment issue':'A professional assessment is recommended',text:r.demo?'The door may need hinge adjustment or strike plate alignment. A handyman can inspect the frame and confirm the right fix.':'This demo uses a sample handyman scenario. Your description and photos would help a professional confirm the issue and define the repair.',scope:r.demo?'Inspect door alignment, adjust hinges and strike plate, and test the latch.':'Initial inspection and minor adjustment. Final scope to be confirmed on site.'};
function detail(){const r=current();if(!r)return dashboard();const a=assessment(r),ps=providers(r),step=['assessment'].includes(r.status)?1:r.status==='quotes'?2:3;return `<button class="btn ghost back" onclick="go('requests')">${I('back',15)}Back to repairs</button><div class="detailsheading"><div><div class="eyebrow" style="margin-bottom:8px">Repair request · ${esc(r.id.toUpperCase())}</div><h1>${esc(r.title)}</h1><p class="muted" style="font-size:12px">${I('location',14)} ${esc(prop(r).name)} · ${esc(prop(r).address)} · ${esc(r.room)}</p></div><span class="badge ${statusColor[r.status]}">${statusText[r.status]}</span></div><div class="stepper">${['Report issue','Assess issue','Compare quotes','Schedule repair'].map((s,i)=>`<div class="step ${i<step?'done':i===step?'current':''}"><span class="stepnum">${i<step?I('check',13):i+1}</span>${s}</div>`).join('')}</div><div class="detailgrid"><div class="stack">${r.status==='scheduled'||r.status==='complete'?confirmation(r):r.status==='scheduling'?schedule(r):`<div class="assessment"><div class="row between"><span class="eyebrow" style="color:#7e906c">${I('spark',14)} Preliminary assessment</span><span class="badge green">${assessmentBadge(r)}</span></div><h3 style="margin-top:15px">${a.title}</h3><p>${a.text}</p>${diagnosisDetails(r)}<div class="hint" style="margin-top:13px">${I('shield',13)} A professional confirms the diagnosis before work begins.</div></div>${r.status==='assessment'?(r.diagnosis&&r.diagnosis.urgency==='emergency'?emergencyCard(r):diyCard(r)+(r.diagnosis&&r.diagnosis.fixPath!=='diy'?proPartsCard(r):'')+`<div class="card"><h3>${r.diagnosis&&r.diagnosis.fixPath==='diy'?'Prefer a pro?':'Let’s find the right help.'}</h3><p class="muted">We’ll share the issue details with three sample local providers, clarify the scope, and ask for an estimate and availability.</p><div class="subtle" style="margin:17px 0">${a.scope}</div><button class="btn" onclick="startOutreach()">${I('phone',16)}Get quotes</button><p class="hint" style="margin-top:14px">This prototype simulates outreach. No one will be contacted.</p></div>`):`<div><div class="sectionhead" style="margin-bottom:6px"><div><h2>Good options. Your choice.</h2><p class="muted" style="font-size:12px">3 sample estimates for the same repair scope.</p></div></div><div class="quotegrid">${ps.map((p,i)=>`<article class="quote ${i===0?'best':''}"><div class="bestlabel">${i===0?'✦ RECOMMENDED MATCH':p.price===Math.min(...ps.map(x=>x.price))?'LOWEST PRICE':''}</div><div class="proicon">${p.initial}</div><h4>${p.name}</h4><div class="rating">★ ${p.rating} <span class="muted">(${p.reviews} reviews)</span></div><div class="price">$${p.price}</div><small class="muted" style="font-size:10px">Estimated total · sample price</small><div class="quotelines">${I('check',12)} Labor & standard parts<br>${I('calendar',12)} ${p.window}<br>${I('shield',12)} Sample verified profile</div><button class="btn ${i===0?'':'secondary'} wide" onclick="approveDialog(${i})">Choose provider ${I('arrow',13)}</button><div class="quoteinfo"><button class="btn ghost" onclick="quoteDetails(${i})">View estimate details</button></div></article>`).join('')}</div><p class="hint" style="margin-top:14px">Estimates may change after inspection. Any additional work needs your approval.</p></div>`}`}${activity(r)}</div><aside class="stack"><div class="card sidebarcard"><h4>The issue at a glance</h4>${r.photos.length?`<div class="photothumbs">${r.photos.map(p=>`<img src="${p}" alt="Uploaded issue photo">`).join('')}</div>`:`<div class="emptyphoto">${I(categoryIcon[r.category],43)}</div><div class="hint" style="margin:7px 0">${r.demo?'Sample scenario · no photo attached':'No photo attached'}</div>`}<p class="requestdescription">${esc(r.description)}</p><div class="divider"></div><div class="minirow"><span class="muted">Property</span><strong>${esc(prop(r).name)}</strong></div><div class="minirow"><span class="muted">Location</span><span>${esc(r.room)}</span></div><div class="minirow"><span class="muted">Priority</span><span>${esc(r.urgency)}</span></div>${state.role==='manager'?`<div class="minirow"><span class="muted">Tenant</span><span>${prop(r).tenant}</span></div>`:''}<button class="btn ghost small" onclick="editDetails()">Edit issue details ${I('arrow',13)}</button></div><div class="card sidebarcard" style="background:#f2f4ec"><div class="row">${I('shield',21)}<h4 style="margin:0">Your say, every step.</h4></div><p class="muted">Choose the provider and approve the estimate. We’ll handle the scheduling around you.</p></div></aside></div>`}
function activity(r){const ps=providers(r),out=r.status!=='assessment';return `<div class="card"><div class="row between"><h3>We’re taking care of the details</h3><span class="badge gray">Demo activity</span></div><div class="timeline"><div class="timelineitem"><span class="timelineicon">${I('check',12)}</span><div><h4>Issue received & assessed</h4><p>Your description ${r.photos.length?'and photos ':''}are ready for a professional.</p></div></div>${out?ps.map((p,i)=>`<div class="timelineitem"><span class="timelineicon">${I('phone',12)}</span><div style="flex:1"><div class="row between"><h4>${p.name}</h4><button class="btn ghost small" onclick="transcript(${i})">View call ${I('arrow',12)}</button></div><p>Sample call completed · Scope discussed · Estimate received</p></div></div>`).join(''):`<div class="timelineitem"><span class="timelineicon">${I('clock',12)}</span><div><h4>Ready to contact professionals</h4><p>Choose “Get quotes” to preview provider outreach.</p></div></div>`}${['scheduled','complete'].includes(r.status)?`<div class="timelineitem"><span class="timelineicon">${I('calendar',12)}</span><div><h4>Appointment confirmed</h4><p>${esc(r.appointment)}</p><button class="btn ghost small" onclick="transcript(${r.provider||0},true)">View scheduling call ${I('arrow',12)}</button></div></div>`:''}</div></div>`}
function showModal(title,subtitle,body){modalFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this&&!busy)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${title}</h2><p class="muted" style="font-size:12px;margin-bottom:0">${subtitle}</p></div><button class="close" aria-label="Close dialog" onclick="closeModal()">${I('x',16)}</button></div><div class="modalbody">${body}</div></section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type=file]),.modal textarea,.modal button')?.focus(),50)}
function closeModal(){if(busy)return;document.getElementById('overlay').innerHTML='';document.body.style.overflow='';modalFocus?.focus()}
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fs=[...modal.querySelectorAll('button:not(:disabled),input:not([type=file]),select,textarea,a[href]')].filter(el=>el.offsetParent!==null);const first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function newRequest(){uploads=[];showModal('What needs a little care?','A photo and a few details are a great place to start.',`<form onsubmit="submitRequest(event)"><div class="field"><label for="issuePhotos">Add photos <span class="muted" style="font-weight:400">(optional)</span></label><input id="issuePhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="addFiles(this.files);this.value=''"><button id="choosePhotos" type="button" class="upload" onclick="document.getElementById('issuePhotos').click()">${I('camera',29)}<strong>Add photos</strong><small>Choose up to 3 JPG, PNG or WebP images · 5 MB each</small></button><div class="previews" id="previews"></div><p id="photoStatus" class="hint" aria-live="polite">Photos stay in this browser for the demo.</p></div><div class="field"><label for="issueTitle">What’s the issue?</label><input id="issueTitle" name="title" required maxlength="90" placeholder="e.g. Water dripping under the kitchen sink"></div><div class="field"><label for="desc">Tell us a little more</label><textarea id="desc" name="description" required maxlength="1200" placeholder="When did it start? What have you noticed?"></textarea></div><div class="fieldgrid"><div class="field"><label for="property">Property</label><select id="property" name="property">${properties.filter(p=>state.role==='manager'||p.id==='p1').map(p=>`<option value="${p.id}">${p.name} · ${p.unit}</option>`).join('')}</select></div><div class="field"><label for="room">Where is it?</label><select id="room" name="room"><option>Kitchen</option><option>Bathroom</option><option>Living room</option><option>Bedroom</option><option>Exterior</option><option>Other</option></select></div></div><div class="field"><label for="urgency">How soon do you need help?</label><select id="urgency" name="urgency" onchange="document.getElementById('urgentNote').hidden=this.value!=='Urgent'"><option>Routine</option><option>Soon</option><option>Urgent</option></select><div class="notice" id="urgentNote" hidden>For immediate danger, a gas smell, or major active flooding, contact local emergency or utility services. This prototype does not dispatch emergency help.</div></div><div class="modalactions"><button type="button" class="btn secondary" onclick="fillSample()">Use sample issue</button><button class="btn" type="submit">Assess issue ${I('spark',16)}</button></div><p class="hint">Your photos are real. Assessment, quotes and calls are simulated in this demo.</p></form>`)}
function fillSample(){document.getElementById('issueTitle').value='Leak under the kitchen sink';document.getElementById('desc').value='There’s a slow drip where the drain pipe connects. The cabinet floor gets damp after running the faucet.';document.getElementById('room').value='Kitchen';document.getElementById('urgency').value='Soon';document.getElementById('urgentNote').hidden=true}
async function addFiles(files){
 const form=document.getElementById('issuePhotos')?.form;if(!form)return;
 const controls=[form.querySelector('[type="submit"]'),document.getElementById('choosePhotos'),document.getElementById('issuePhotos')];
 controls.forEach(c=>{if(c)c.disabled=true});document.getElementById('photoStatus').textContent='Preparing your photos…';
 try{for(const f of Array.from(files)){
  if(!form.isConnected)break;
  if(uploads.length>=3){toast('You can add up to 3 photos.');break}
  if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){toast('Choose a JPG, PNG or WebP image up to 5 MB.');continue}
  const data=await new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>resolve(null);fr.readAsDataURL(f)});
  if(!data){toast('Could not read that photo. Try another image.');continue}
  const compressed=await new Promise(resolve=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas'),scale=Math.min(1,1000/im.width,1000/im.height);c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))}catch{resolve(null)}};im.onerror=()=>resolve(null);im.src=data});
  if(!form.isConnected)break;
  if(compressed)uploads.push(compressed);else toast('That image could not be opened. Try another JPG, PNG or WebP.');
 }}finally{if(form.isConnected){controls.forEach(c=>{if(c)c.disabled=false});renderPreviews()}}
}
function renderPreviews(){const status=document.getElementById('photoStatus');if(status)status.textContent=uploads.length?`${uploads.length} of 3 photos added · saved only in this browser`:'Photos stay in this browser for the demo.';const p=document.getElementById('previews');if(p)p.innerHTML=uploads.map((u,i)=>`<div class="previewitem"><img src="${u}" alt="Issue photo ${i+1}"><button type="button" aria-label="Remove photo ${i+1}" onclick="uploads.splice(${i},1);renderPreviews()">${I('x',13)}</button></div>`).join('')}
async function submitRequest(e){e.preventDefault();if(busy)return;const f=new FormData(e.target),title=f.get('title').trim(),description=f.get('description').trim();if(!title||!description){toast('Add a title and a short description.');return}const t=(title+' '+description).toLowerCase(),category=/sink|drip|water|leak|pipe|toilet|faucet/.test(t)?'plumbing':/air|ac |cool|heat|hvac/.test(t)?'hvac':'general';const r={id:'r'+Date.now(),title,description,category,property:f.get('property'),room:f.get('room'),urgency:f.get('urgency'),status:'assessment',photos:[...uploads],created:'Today',demo:false};busy=true;showModal('Taking a closer look','Claude is reviewing your photo and description.',`<div class="progressbox"><div class="spinner"></div><h3>Assessing the issue…</h3><p class="muted">This usually takes 10–20 seconds.</p><div class="subtle" style="margin-top:20px">Preliminary AI assessment · a professional confirms the diagnosis.</div></div>`);try{const body=new FormData(),p=properties.find(x=>x.id===r.property);body.append('title',title);body.append('description',description);body.append('propertyId',r.property);if(p)body.append('unit',p.unit);body.append('room',r.room||'');if(uploads[0])body.append('photo',await (await fetch(uploads[0])).blob(),'photo.jpg');const res=await fetch('/api/requests',{method:'POST',body}),data=await res.json().catch(()=>({}));if(!res.ok||!data.diagnosis)throw new Error(data.error||'HTTP '+res.status);r.serverId=data.id;r.diagnosis=data.diagnosis;r.notice=data.notice||null;r.category=categoryForTrade(data.diagnosis.trade)}catch(err){console.warn('Assessment failed',err);toast('AI assessment unavailable — showing a sample assessment.')}state.requests.unshift(r);state.current=r.id;state.page='detail';busy=false;closeModal();save();render();window.scrollTo(0,0)}
let partPollTimer=null;
async function searchPartsAnyway(){
 const r=current();
 if(!r.serverId){toast("Submit a new issue to use the real part-search agent.");return}
 const btn=document.getElementById("searchPartsBtn");if(btn)btn.disabled=true;
 try{
  const res=await fetch(`/api/requests/${r.serverId}/parts`,{method:"POST"});
  const data=await res.json().catch(()=>({}));
  if(res.status===202||res.status===409){
   if(data&&data.partSearch)r.partSearch=data.partSearch;
   save();render();pollPartSearch(r.id);
  }else{
   toast(data.error||"Could not start the part search.");
   if(btn)btn.disabled=false;
  }
 }catch(e){toast("Could not reach the part-search agent.");if(btn)btn.disabled=false}
}
function pollPartSearch(localId){
 clearInterval(partPollTimer);
 partPollTimer=setInterval(async()=>{
  const r=state.requests.find(x=>x.id===localId);
  if(!r||!r.serverId||!r.partSearch||r.partSearch.status!=="searching"){clearInterval(partPollTimer);return}
  try{
   const res=await fetch(`/api/requests/${r.serverId}`);if(!res.ok)return;
   const data=await res.json();
   if(data.partSearch)r.partSearch=data.partSearch;
   save();
   if(state.current===localId)render();
   if(!r.partSearch||r.partSearch.status!=="searching")clearInterval(partPollTimer);
  }catch{}
 },3000);
}
function startOutreach(){const r=current();busy=true;showModal('Finding the right help','Simulated provider outreach — no real calls are placed.',`<div class="progressbox"><div class="spinner"></div><h3 id="progressTitle">Sharing the repair details</h3><div class="progresssteps" id="progressSteps">${providers(r).map(p=>`<div>${I('phone',16)} &nbsp; ${p.name}</div>`).join('')}</div></div>`);setTimeout(()=>{document.getElementById('progressTitle').textContent='Checking scope, pricing & availability'},850);setTimeout(()=>{r.status='quotes';busy=false;closeModal();save();render();toast('Three sample estimates are ready to compare.')},1900)}
function quoteDetails(i){const r=current(),p=providers(r)[i];showModal(p.name,'Sample estimate · final scope confirmed on site',`<div class="row between"><span class="rating">★ ${p.rating} · ${p.reviews} sample reviews</span><span class="badge green">Available ${p.window.toLowerCase()}</span></div><h3 style="margin:18px 0 8px">Included in the estimate</h3><p class="muted">${assessment(r).scope}</p><div class="divider"></div><div class="minirow"><span>Labor / service visit</span><span>$${p.labor}</span></div><div class="minirow"><span>Standard parts allowance</span><span>$${p.parts}</span></div><div class="divider"></div><div class="row between"><h3>Estimated total</h3><h2>$${p.price}</h2></div><p class="hint">Illustrative total including applicable fees and taxes. Extra parts or additional work require approval.</p><div class="subtle" style="margin-top:18px">${I('shield',16)} ${p.warranty}</div><div class="modalactions"><button class="btn secondary" onclick="transcript(${i})">View call transcript</button><button class="btn" onclick="approveDialog(${i})">Choose provider</button></div>`)}
function approveDialog(i){const r=current(),p=providers(r)[i];showModal('Approve your provider','You choose the professional and the estimated price.',`<div class="card"><div class="row"><div class="proicon" style="margin:0">${p.initial}</div><div><h3>${p.name}</h3><div class="rating">★ ${p.rating} · ${p.reviews} sample reviews</div></div></div><div class="divider"></div><div class="row between"><span>Estimated total</span><h2>$${p.price}</h2></div><p class="hint">${assessment(r).scope}</p></div><p class="hint" style="margin-top:18px">Approving this estimate lets you choose appointment windows next. Additional work must be approved separately.</p><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Keep comparing</button><button class="btn" onclick="approve(${i})">Approve estimate ${I('check',16)}</button></div>`)}
function approve(i){const r=current();r.provider=i;r.status='scheduling';pickedSlots=[];closeModal();save();render();window.scrollTo(0,0)}
function slotOptions(r){const start=r.provider===2?2:1;return [start,start+1,start+2].flatMap(n=>['9 am–12 pm','1 pm–4 pm'].map(t=>({date:makeDate(n),time:t,value:makeDate(n)+' · '+t}))) }
function schedule(r){const p=providers(r)[r.provider||0];return `<div class="card"><div class="row between"><div><div class="eyebrow" style="margin-bottom:10px">Your approved provider</div><h3>${p.name}</h3></div><h2>$${p.price}<small class="muted" style="display:block;font:11px 'DM Sans';letter-spacing:0;margin-top:5px">estimated total</small></h2></div><button class="btn ghost small" style="margin-top:8px" onclick="current().status='quotes';save();render()">Change provider</button></div><div class="card"><h2>When works for you?</h2><p class="muted">Choose one or more windows. We’ll call your provider to confirm a match.</p><div class="hint">All times shown in your device’s local timezone.</div><div class="slots">${slotOptions(r).map((s,i)=>`<button class="slot ${pickedSlots.includes(i)?'selected':''}" aria-pressed="${pickedSlots.includes(i)}" onclick="toggleSlot(${i},this)"><strong>${s.date}</strong><small>${s.time}</small></button>`).join('')}</div><div class="field" style="margin-top:23px"><label for="access">Access instructions ${state.role==='manager'?'& tenant availability':''}</label><textarea id="access" placeholder="e.g. I’ll be home. Please ring the doorbell." oninput="current().access=this.value;save()">${esc(r.access||'')}</textarea></div>${state.role==='manager'?`<div class="subtle" style="margin-bottom:19px">${I('home',15)} ${prop(r).unit} · Tenant: ${prop(r).tenant}<br><span class="hint">Use access instructions to coordinate the visit with your tenant.</span></div>`:''}<button id="scheduleBtn" class="btn wide" ${pickedSlots.length?'':'disabled'} onclick="book()">${I('phone',16)}Call to schedule</button><p class="hint" style="margin-top:12px">Demo scheduling call · no real booking or message is sent.</p></div>`}
function toggleSlot(i,el){pickedSlots=pickedSlots.includes(i)?pickedSlots.filter(v=>v!==i):[...pickedSlots,i];el.classList.toggle('selected',pickedSlots.includes(i));el.setAttribute('aria-pressed',pickedSlots.includes(i));document.getElementById('scheduleBtn').disabled=!pickedSlots.length}
function book(){if(!pickedSlots.length)return;const r=current();const chosen=slotOptions(r)[[...pickedSlots].sort((a,b)=>a-b)[0]];r.access=document.getElementById('access').value;busy=true;showModal('Confirming your appointment','Simulated scheduling call',`<div class="progressbox"><div class="spinner"></div><h3>Calling ${providers(r)[r.provider||0].name}</h3><p class="muted">Matching your time windows and sharing access instructions.</p></div>`);setTimeout(()=>{r.appointment=chosen.value;r.status='scheduled';busy=false;closeModal();save();render();window.scrollTo(0,0);toast('Your demo appointment is confirmed.')},1600)}
function confirmation(r){const p=providers(r)[r.provider||0];return `<div class="card confirmation"><div class="successicon">${I('check',28)}</div><div class="eyebrow" style="margin-bottom:9px">${r.status==='complete'?'Repair wrapped up':'One less thing to think about'}</div><h2>${r.status==='complete'?'All taken care of.':'You’re on the calendar.'}</h2><p class="muted">${r.status==='complete'?'Your sample repair has been marked complete.':'Your demo appointment is confirmed with '+p.name+'.'}</p><div class="confirmedinfo"><div class="minirow"><span class="muted">When</span><strong>${esc(r.appointment)}</strong></div><div class="minirow"><span class="muted">Where</span><span>${esc(prop(r).name)}</span></div><div class="minirow"><span class="muted">Provider</span><span>${p.name}</span></div><div class="minirow"><span class="muted">Estimate</span><strong>$${p.price}</strong></div>${r.access?`<div class="divider"></div><div class="hint"><strong>Access instructions</strong><br>${esc(r.access)}</div>`:''}</div>${r.status!=='complete'?`<div class="row" style="justify-content:center"><button class="btn secondary" onclick="pickedSlots=[];current().status='scheduling';save();render()">Reschedule</button><button class="btn" onclick="current().status='complete';save();render();toast('Repair marked complete.')">Mark complete</button></div>`:''}<p class="hint" style="margin-top:20px">Prototype confirmation · no real appointment has been booked.</p></div>`}
function transcript(i,scheduling=false){const r=current(),p=providers(r)[i];showModal(scheduling?'Scheduling call':'Provider call transcript',p.name+' · illustrative conversation',`<span class="badge green">${I('check',12)} Sample call completed</span><div class="callbubble assistant"><small>HANDY ASSISTANT</small>${scheduling?`The homeowner approved your estimate. They’re available ${esc(r.appointment)}. Can you confirm that window?`:`I’m helping with a repair at ${esc(prop(r).name)}. The issue is: “${esc(r.description)}” Can you help confirm the likely scope and provide an estimate?`}</div><div class="callbubble"><small>${p.name.toUpperCase()}</small>${scheduling?'Yes, that window works. We’ll call before arriving.':`${assessment(r).scope} We’ll need to inspect it to confirm. Our estimate is $${p.price}, including labor and standard parts.`}</div><div class="callbubble assistant"><small>HANDY ASSISTANT</small>${scheduling?`Access instructions: ${esc(r.access||'Contact the homeowner on arrival.')} We’ll show the appointment confirmation in the app.`:'Is that the estimated total, and when is your next availability?'}</div><div class="callbubble"><small>${p.name.toUpperCase()}</small>${scheduling?'Confirmed.':'Yes. We’re available '+p.window.toLowerCase()+'. Any additional work will be discussed and approved before proceeding.'}</div><div class="subtle">${scheduling?'Outcome: demo appointment confirmed.':'Outcome: scope clarified, estimate received, availability recorded.'}</div><p class="hint">This transcript is scripted for feature review. No call was placed.</p>`)}
function editDetails(){const r=current();showModal('Edit issue details','Keep the description clear for your service provider.',`<form onsubmit="event.preventDefault();const f=new FormData(event.target);current().description=f.get('description').trim();current().urgency=f.get('urgency');save();closeModal();render();toast('Issue details updated.');"><div class="field"><label for="editDesc">Description</label><textarea id="editDesc" name="description" required maxlength="1200">${esc(r.description)}</textarea></div><div class="field"><label for="editUrgency">Priority</label><select id="editUrgency" name="urgency">${['Routine','Soon','Urgent'].map(x=>`<option ${r.urgency===x?'selected':''}>${x}</option>`).join('')}</select></div><p class="hint">Existing estimates remain illustrative. In a live app, material scope changes would require updated quotes.</p><button class="btn wide">Save changes</button></form>`)}
function propertyView(){return `<div class="row between intro"><div><div class="eyebrow" style="margin-bottom:10px">A place for everything</div><h1>${state.role==='manager'?'Your properties':'Your home'}</h1><p>Repair history and appointments, organized by address.</p></div></div><div class="propertygrid">${properties.filter(p=>state.role==='manager'||p.id==='p1').map(p=>`<div class="card"><div class="propertyart">${houseArt()}</div><h3>${p.name}</h3><p class="muted">${p.address}<br>${p.unit}</p>${state.role==='manager'?`<div class="hint">Tenant: ${p.tenant}</div>`:''}<div class="divider"></div><div class="row between"><span class="hint">${state.requests.filter(r=>r.property===p.id&&r.status!=='complete').length} active repairs</span><button class="btn ghost small" onclick="state.propertyFilter='${p.id}';state.page='requests';state.filter='all';render()">View repairs ${I('arrow',14)}</button></div></div>`).join('')}</div>`}
function calendarView(){const rs=visible().filter(r=>r.status==='scheduled');return `<div class="row between intro"><div><div class="eyebrow" style="margin-bottom:10px">Make room for the fix</div><h1>Your appointments</h1><p>Upcoming visits across ${state.role==='manager'?'your properties':'your home'}.</p></div><button class="btn secondary" onclick="go('requests')">View repairs ${I('arrow',15)}</button></div>${rs.length?rs.map(r=>`<div class="calendaritem"><div class="datebox">${I('calendar',25)}<small style="display:block;margin-top:8px">Booked</small></div><div style="flex:1"><div class="row between wrap"><h3>${esc(r.title)}</h3><span class="badge green">Confirmed · demo</span></div><p>${esc(r.appointment)}</p><div class="hint">${providers(r)[r.provider||0].name} · ${prop(r).name}</div><button class="btn ghost small" style="margin-top:7px" onclick="openRequest('${r.id}')">View appointment ${I('arrow',14)}</button></div></div>`).join(''):`<div class="card emptystate">${I('calendar',36)}<h3 style="margin-top:18px">A little breathing room.</h3><p>No appointments yet. Approve a quote to arrange your first repair.</p><button class="btn" style="margin-top:15px" onclick="openRequest('r1')">Explore a sample repair</button></div>`}`}
function openGuide(){showModal('Take Handy for a spin','A clickable prototype of your repair assistant.',`<div class="stack">${[['camera','1. Report an issue','Upload photos, add a short description, and choose a property.'],['spark','2. Review an assessment','Preview a likely issue and the professional needed to confirm it.'],['phone','3. Collect & compare quotes','Explore sample provider calls, transcripts, scope, prices, and availability.'],['check','4. Approve your choice','Select a provider and approve the estimated price.'],['calendar','5. Schedule the repair','Choose time windows, add access instructions, and preview a scheduling call.'],['building','6. Manage multiple properties','Switch to Property manager in the sidebar to review tenant and property views.']].map(([ic,t,d])=>`<div class="row" style="align-items:start"><span class="iconbox">${I(ic,18)}</span><div><h4>${t}</h4><p class="hint" style="margin:5px 0">${d}</p></div></div>`).join('')}</div><div class="subtle" style="margin-top:22px">All providers, ratings, prices, calls, and assessments are fictional demo content. Photos and progress are stored only in this browser.</div><div class="modalactions"><button class="btn secondary" onclick="resetDemo()">${I('refresh',14)}Reset demo</button><button class="btn" onclick="closeModal();newRequest()">Try a new issue ${I('arrow',15)}</button></div>`)}
function resetDemo(){state={role:'homeowner',page:'overview',filter:'all',requests:seed(),current:'r1',propertyFilter:'all'};pickedSlots=[];save();closeModal();render();toast('Demo restored to its starting state.')}
render();
</script></body></html>
